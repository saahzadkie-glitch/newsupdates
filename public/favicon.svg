<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="nGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded box -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="#6366f1" stroke-width="2" stroke-opacity="0.4" />

  <!-- Tech lines in background -->
  <path d="M12 20 h40 M12 44 h40" stroke="#334155" stroke-width="1" stroke-dasharray="2 3" opacity="0.4" />

  <!-- Stylized N Emblem -->
  <path d="M18 46 V18 L34 36 V18 H44 V46 L28 28 V46 Z" fill="url(#nGrad)" filter="url(#glow)" />

  <!-- Accent top bar -->
  <rect x="18" y="14" width="28" height="2" rx="1" fill="url(#accentGrad)" />

  <!-- Live Pulse Dot -->
  <circle cx="50" cy="14" r="4" fill="#10b981" />
  <circle cx="50" cy="14" r="6" fill="#10b981" opacity="0.4" />
</svg>
